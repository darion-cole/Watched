name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Watched.app
        run: bash build.sh
      - name: Zip
        run: ditto -c -k --keepParent Watched.app Watched-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Watched-macOS
          path: Watched-macOS.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Watched-macOS.zip \
            --title "Watched build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated build from ${GITHUB_SHA::7}" --latest
